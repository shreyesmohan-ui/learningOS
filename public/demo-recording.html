<!doctype html><html><head><meta charset="utf-8"><title>Learning OS — Demo Recording</title><style>*{box-sizing:border-box}body{margin:0;background:#101725;color:white;font:16px system-ui}header{height:105px;padding:18px 28px;border-bottom:3px solid #56dbb0;display:flex;align-items:center;gap:24px}.badge{background:#56dbb0;color:#10251e;padding:10px 14px;border-radius:8px;font-weight:800;white-space:nowrap}h1{font-size:23px;margin:0 0 5px}p{margin:0;color:#d2dcee;font-size:16px}select{margin-left:auto;max-width:150px;background:#243047;color:white;border:1px solid #68768c;padding:8px;border-radius:7px}main{position:relative;height:calc(100vh - 105px)}iframe{border:0;width:100%;height:100%;background:white}#focus{position:absolute;pointer-events:none;border:4px solid #ffae38;border-radius:12px;box-shadow:0 0 0 3px #ffae3833;transition:all .6s ease;display:none}.note{position:absolute;bottom:12px;left:18px;background:#101725e8;color:white;padding:7px 12px;border-radius:6px;font-size:12px;pointer-events:none}</style></head><body><header><span class="badge" id="badge">01 / 06</span><div><h1 id="title">Can you solve it without the coach?</h1><p id="caption">Learning OS: SQL practice, graduated hints, and independent checkpoints.</p></div><select aria-label="Demo step"><option value="0">1. Introduction</option><option value="1">2. Run SQL</option><option value="2">3. Get a hint</option><option value="3">4. Solve the task</option><option value="4">5. Checkpoint</option><option value="5">6. Evidence</option></select></header><main><iframe title="Learning OS live app" src="https://learning-os-sql-studio.vercel.app"></iframe><div id="focus"></div><div class="note">Live prototype · Synthetic data · Authored hints · Learner study not yet run</div></main><script>const steps=[['Can you solve it without the coach?','Learning OS: SQL practice, graduated hints, and independent checkpoints.',null],['Run SQL. Check the result.','A query can execute successfully and still fail to answer the question.',['24%','19%','47%','68%']],['A nudge, not a complete answer.','Hints become progressively more specific. Helped attempts are marked assisted.',['72%','16%','27%','72%']],['Correct the query. Verify on two datasets.','Result-set comparison checks the answer. The model does not grade correctness.',['24%','19%','47%','68%']],['Remove the coach. Test independently.','Checkpoint questions have no hints or worked solutions.',['24%','19%','47%','68%']],['Evidence, not just completion.','Track assistance and attempts. External learner validation remains to be done.',null]];document.querySelector('select').onchange=e=>{const i=Number(e.target.value),s=steps[i];document.querySelector('#badge').textContent=String(i+1).padStart(2,'0')+' / 06';document.querySelector('#title').textContent=s[0];document.querySelector('#caption').textContent=s[1];const f=document.querySelector('#focus');f.style.display=s[2]?'block':'none';if(s[2])[f.style.left,f.style.top,f.style.width,f.style.height]=s[2];};</script></body></html>
